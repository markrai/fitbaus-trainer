apply plugin: 'com.android.application'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def trainerSigningValue = { String key ->
    (findProperty(key) as String) ?: localProperties.getProperty(key)
}

def trainerSigningRequired = (findProperty('fitbaus.signing.required') as String) == 'true'
def trainerStoreFile = trainerSigningValue('fitbaus.signing.storeFile')
def trainerHasSigning = trainerStoreFile != null &&
    trainerSigningValue('fitbaus.signing.storePassword') != null &&
    trainerSigningValue('fitbaus.signing.keyAlias') != null &&
    trainerSigningValue('fitbaus.signing.keyPassword') != null

if (trainerSigningRequired && !trainerHasSigning) {
    throw new GradleException(
        'fitbaus.signing.required=true but Trainer release signing properties are missing. ' +
        'No debug signing fallback.'
    )
}

android {
    namespace = "com.markrai.fitbaus.trainer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.markrai.fitbaus.trainer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.fitbausVersionCode
        versionName rootProject.ext.fitbausVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (trainerHasSigning) {
            release {
                storeFile file(trainerStoreFile)
                storePassword trainerSigningValue('fitbaus.signing.storePassword')
                keyAlias trainerSigningValue('fitbaus.signing.keyAlias')
                keyPassword trainerSigningValue('fitbaus.signing.keyPassword')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Historical tags may still produce unsigned release APKs; CI signs with apksigner.
            // When signing properties are present on a tooling-capable source tree, use them.
            if (trainerHasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

tasks.register("printFitbausVersion") {
    doLast {
        println "FITBAUS_VERSION_NAME=${android.defaultConfig.versionName}"
        println "FITBAUS_VERSION_CODE=${android.defaultConfig.versionCode}"
        println "FITBAUS_APPLICATION_ID=${android.defaultConfig.applicationId}"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
