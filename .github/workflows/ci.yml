name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trainer:
    name: Trainer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --exit-code

  bridge-core:
    name: ProForm bridge Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test equipment-bridges/proform-smart-power-10/tests/Fitbaus.BikeBridge.Core.Tests/Fitbaus.BikeBridge.Core.Tests.csproj --configuration Release
